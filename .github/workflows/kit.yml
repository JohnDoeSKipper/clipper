name: Tonight's posting kit

# 7 pm Malaysia time (11:00 UTC; minute 7 because GitHub delays runs on the hour).
# Builds https://johndoeskipper.github.io/clipper/ with tonight's videos and captions,
# then opens a reminder issue (GitHub sends it to your phone).
on:
  schedule:
    - cron: "7 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: kit
  cancel-in-progress: false

jobs:
  kit:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build tonight's page
        id: kit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python engine/kit.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Save what was handed out (only once the page is live)
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add catalog/posted.json
          git diff --cached --quiet || (git commit -m "Posting kit $(TZ=Asia/Kuala_Lumpur date +%F)" && git pull --rebase -q && git push)
      - name: Remind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.kit.outputs.summary }}
        run: |
          gh label create posting --color 0a84ff --force >/dev/null
          for n in $(gh issue list --label posting --state open --json number -q '.[].number'); do gh issue close "$n" >/dev/null; done
          gh issue create --label posting \
            --title "Post tonight at 8 pm ($(TZ=Asia/Kuala_Lumpur date '+%a %d %b'))" \
            --body "Open the kit on your phone: ${{ steps.deploy.outputs.page_url }}

          Tonight: $SUMMARY

          Steps: Guide → section 5."
