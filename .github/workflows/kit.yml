name: Tonight's posting kit

# Builds https://johndoeskipper.github.io/clipper/ with today's videos and captions.
# GitHub's scheduler can start a run hours late, so it runs four times a day
# (8:07 am, 12:07, 4:07 pm, 6:07 pm Malaysia time) and after every render; every run
# on the same Malaysia date shows the same videos. The reminder issue is opened once a day.
on:
  schedule:
    - cron: "7 0,4,8,10 * * *"
  workflow_run:
    workflows: ["Render videos"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: kit
  cancel-in-progress: false

jobs:
  kit:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build tonight's page
        id: kit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python engine/kit.py
      - name: Switch GitHub Pages on (works only if allowed; otherwise turn it on in Settings > Pages)
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Save what was handed out (only once the page is live)
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add catalog/posted.json
          git diff --cached --quiet || (git commit -m "Posting kit $(TZ=Asia/Kuala_Lumpur date +%F)" && git pull --rebase -q && git push)
      - name: Remind (once a day)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.kit.outputs.summary }}
        run: |
          TITLE="Post tonight at 8 pm ($(TZ=Asia/Kuala_Lumpur date '+%a %d %b'))"
          gh label create posting --color 0a84ff --force >/dev/null
          if gh issue list --label posting --state open --json title -q '.[].title' | grep -Fxq "$TITLE"; then echo "reminder already open"; exit 0; fi
          for n in $(gh issue list --label posting --state open --json number -q '.[].number'); do gh issue close "$n" >/dev/null; done
          gh issue create --label posting --title "$TITLE" \
            --body "Open the kit on your phone: ${{ steps.deploy.outputs.page_url }}

          Tonight: $SUMMARY

          Steps: Guide → section 5.

          Watched them? Reply here with anything to improve (one comment per point is fine). The writer turns it into rules for the next videos the following morning."
